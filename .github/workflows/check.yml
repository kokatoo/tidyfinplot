name: R CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Optional: Test Node 24 early
    strategy:
      matrix:
        r-version: ['4.3', '4.4']

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::devtools
            any::testthat
            any::covr
            any::cucumber
            any::tidyquant
            any::ggplot2
            any::dplyr
            any::scales
            any::zoo
            any::RColorBrewer

      - name: Install package
        run: devtools::install()
        shell: Rscript {0}

      - name: Run unit tests
        run: devtools::test()
        shell: Rscript {0}

      - name: Run BDD tests
        run: |
          library(cucumber)
          cucumber::test("tests/acceptance")
        shell: Rscript {0}

      - name: Run coverage
        run: |
          library(covr)
          cov <- package_coverage()
          covr::to_cobertura(cov, "coverage.xml")
          print(cov)
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
